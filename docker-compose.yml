services:
  backend:
    build: ./backend
    container_name: dosmart-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides backend/.env: the container's filesystem is ephemeral except for
      # the /data volume below, so the SQLite file must live there, not in /app.
      DATABASE_URL: sqlite:////data/dosmart.db
    ports:
      - "8000:8000"
    volumes:
      - dosmart_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dosmart_data:
